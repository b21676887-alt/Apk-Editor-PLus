name: Android CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully generated app/google-services.json from secret."
          else
            # fallback dummy JSON (make sure this is acceptable for your build)
            echo '{"project_info":{"project_number":"000000000000","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:00000"}}]}' > app/google-services.json
            echo "Generated dummy app/google-services.json fallback."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=1 assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Find and Rename APK (Signed or Unsigned)
        shell: bash
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          TARGET_NAME="app-release-${{ steps.set_sha.outputs.short_sha }}.apk"

          # البحث عن ملف APK داخل مجلد الـ release سواء كان موقعاً أم غير موقع
          APK_FILE=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.apk" ! -name "$TARGET_NAME" | head -n 1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK file at: $APK_FILE"
            mv "$APK_FILE" "$RELEASE_DIR/$TARGET_NAME"
            echo "Renamed $APK_FILE to $TARGET_NAME"
          else
            echo "Error: No APK file generated in $RELEASE_DIR"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

  publishRelease:
    name: Publish APK to GitHub Releases
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./release-assets

      - name: Set release metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="main-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.build.outputs.short_sha }}"
          asset_name="Apk-Editor-PLus-${{ needs.build.outputs.short_sha }}-run${{ github.run_number }}.apk"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

          cp ./release-assets/app-release-${{ needs.build.outputs.short_sha }}.apk \
             "./release-assets/${asset_name}"

      - name: Create release for this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # التاكد من وجود ملف release-notes.md، وإن لم يوجد يتم إنشاء وصف افتراضي
          NOTES_FLAG="--notes-file release-notes.md"
          if [ ! -f "release-notes.md" ]; then
            NOTES_FLAG="--notes Automated development build for commit ${{ needs.build.outputs.short_sha }}."
          fi

          gh release create "${{ steps.release_meta.outputs.release_tag }}" \
            -R "${GITHUB_REPOSITORY}" \
            "./release-assets/${{ steps.release_meta.outputs.asset_name }}" \
            --title "Development Build #${{ github.run_number }} (${{ needs.build.outputs.short_sha }})" \
            $NOTES_FLAG \
            --latest \
            --target "${GITHUB_SHA}"

  cleanupArtifactsAndReleases:
    name: Clean up old artifacts and releases
    runs-on: ubuntu-latest
    needs: publishRelease
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete old artifacts (keep only 5 most recent)
        uses: actions/github-script@v9
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            artifacts.artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = artifacts.artifacts.slice(5);

            for (const artifact of toDelete) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      - name: Delete old releases (keep only 5 most recent)
        uses: actions/github-script@v9
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = releases.slice(5);

            for (const release of toDelete) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
            }
